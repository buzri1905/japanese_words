name: Pick mother_jp words

on:
  schedule:
    # 매일 KST 02:00 = UTC 17:00 (KST = UTC+9)
    # (GitHub Actions cron은 부하에 따라 몇 분 지연될 수 있음)
    - cron: "0 17 * * *"
  workflow_dispatch: {}  # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: pick-mother-jp
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pick today's mother_jp words
        run: python3 pick_words.py mother_jp

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- mother_jp/today.json mother_jp/vocabulary.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          DATE="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          git add mother_jp/today.json mother_jp/vocabulary.json
          git commit -m "mother_jp ${DATE}: daily auto-pick"
          git push
